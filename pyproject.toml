[project]
name = "sql-mini-mcp"
version = "0.1.0"
description = "Minimal, read-only, PII-safe MCP server for SQL databases."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "anyio>=4.8,<5",
    "cryptography>=44,<47",
    "mcp>=2,<3",
    "pydantic>=2.10,<3",
    "pyodbc>=5.2,<6",
    "pymysql>=1.1,<2",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<3",
    "sqlglot>=27,<29",
]

[project.scripts]
sql-mini-mcp = "sql_mini_mcp.__main__:main"

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "mutmut>=3.3,<4; sys_platform != 'win32'",
    "prek>=0.2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11",
    "ty>=0.0.1a20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_mini_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires a live database",
    "deep: expensive security verification",
]

[tool.coverage.run]
branch = true
source = ["sql_mini_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["src", "tests"]

[tool.mutmut]
paths_to_mutate = ["src/sql_mini_mcp/security/", "src/sql_mini_mcp/config.py"]
tests_dir = ["tests/unit/", "tests/security/"]
pytest_add_cli_args = ["-q", "-m", "not integration and not deep"]
