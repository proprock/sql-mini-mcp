# Adversarial SQL corpus: structural constructs outside the supported SELECT subset.

# --- CTE, subquery, set operations -----------------------------------------------------------
- name: cte
  sql: "WITH x AS (SELECT Id FROM Users) SELECT Id FROM x"
  reason: CTE
- name: recursive cte
  sql: "WITH x AS (SELECT 1 AS n UNION ALL SELECT n + 1 FROM x WHERE n < 100) SELECT n FROM x"
  reason: recursive CTE
- name: cte hiding table name
  sql: "WITH Users AS (SELECT Id, Email FROM Users) SELECT Id FROM Users"
  reason: CTE shadowing a protected table name
- name: scalar subquery in select
  sql: "SELECT (SELECT TOP 1 Email FROM Users) FROM Users"
  reason: subquery can smuggle a protected column
- name: subquery in where
  sql: "SELECT Id FROM Users WHERE Id IN (SELECT Id FROM Orders)"
  reason: subquery
- name: correlated subquery
  sql: "SELECT Id FROM Users u WHERE EXISTS (SELECT 1 FROM Orders o WHERE o.UserId = u.Id)"
  reason: subquery
- name: derived table
  sql: "SELECT d.Email FROM (SELECT Email FROM Users) AS d"
  reason: derived table hides lineage
- name: derived table star
  sql: "SELECT * FROM (SELECT Email AS Id FROM Users) AS d"
  reason: derived table relabels a protected column
- name: union exfil
  sql: "SELECT Id FROM Users UNION SELECT Id FROM Orders"
  reason: set operation
- name: union all relabel
  sql: "SELECT Name FROM Users UNION ALL SELECT Email FROM Users"
  reason: set operation can relabel protected values
- name: intersect
  sql: "SELECT Id FROM Users INTERSECT SELECT Id FROM Orders"
  reason: set operation
- name: except
  sql: "SELECT Id FROM Users EXCEPT SELECT Id FROM Orders"
  reason: set operation
- name: parenthesized select
  sql: "(SELECT Id FROM Users)"
  reason: root is not a plain SELECT
- name: parenthesized union
  sql: "(SELECT Id FROM Users) UNION (SELECT Id FROM Orders)"
  reason: set operation
- name: values table constructor
  sql: "SELECT * FROM (VALUES (1), (2)) AS v(n)"
  reason: table constructor
- name: table value constructor in from
  sql: "SELECT Id FROM Users, (VALUES (1)) AS v(n)"
  reason: comma join and constructor
- name: subquery as join source
  sql: "SELECT u.Id FROM Users u JOIN (SELECT Id FROM Orders) o ON u.Id = o.Id"
  reason: derived table

