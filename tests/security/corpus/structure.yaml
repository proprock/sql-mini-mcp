  reason: missing ON
- name: join using
  sql: "SELECT u.Id FROM Users u JOIN Orders o USING (Id)"
  reason: unsupported syntax
- name: natural join
  sql: "SELECT u.Id FROM Users u NATURAL JOIN Orders o"
  reason: unsupported syntax

