- name: right join
  sql: "SELECT u.Id FROM Users u RIGHT JOIN Orders o ON u.Id = o.UserId"
  reason: unsupported join type
- name: full join
  sql: "SELECT u.Id FROM Users u FULL OUTER JOIN Orders o ON u.Id = o.UserId"
  reason: unsupported join type
- name: cross join
  sql: "SELECT u.Id FROM Users u CROSS JOIN Orders o"
  reason: unsupported join type
- name: implicit comma join
  sql: "SELECT u.Id FROM Users u, Orders o WHERE u.Id = o.UserId"
  reason: implicit join
- name: join without on
