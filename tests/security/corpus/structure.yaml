- name: outer apply subquery
  sql: "SELECT u.Id FROM Users u OUTER APPLY (SELECT TOP 1 * FROM Orders) o"
  reason: APPLY
- name: pivot
  sql: "SELECT * FROM Users PIVOT (COUNT(Id) FOR Name IN ([a])) p"
  reason: PIVOT
- name: unpivot exfil
  sql: "SELECT * FROM Users UNPIVOT (v FOR c IN (Name, Email)) u"
  reason: UNPIVOT relabels protected columns
- name: nolock hint
