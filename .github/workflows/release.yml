name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build and publish (a pushed tag always publishes main)"
        required: true
        type: choice
        default: main
        options:
          - main
          - compat
          - all
      tag:
        description: "Existing tag to build (for example, v1.2.0). Required for main and all; optional for compat"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push' || inputs.package == 'main' || inputs.package == 'all'
    runs-on: ubuntu-latest
    environment: pypi
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Require a tag for the main package
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$INPUT_TAG" ]; then
            echo "The tag input is required to publish the main package" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"

      - name: uv sync
        run: uv sync --all-groups --locked

      - name: Build sdist and wheel
        run: uv build

      - name: Create synthetic configuration
        run: |
          cat > /tmp/sql-safe-mcp-config.yaml <<'EOF'
          version: 1
          servers:
            release-metadata:
              engine: sqlserver
              connection_url: mssql+pyodbc://user:password@host/master?driver=x
          EOF

      - name: Verify sdist installs cleanly and validates configuration
        run: |
          python -m venv /tmp/verify-sdist
          /tmp/verify-sdist/bin/pip install --quiet dist/*.tar.gz
          /tmp/verify-sdist/bin/sql-safe-mcp --config /tmp/sql-safe-mcp-config.yaml --check-config

      - name: Verify wheel installs cleanly and validates configuration
        run: |
          python -m venv /tmp/verify-wheel
          /tmp/verify-wheel/bin/pip install --quiet dist/*.whl
          /tmp/verify-wheel/bin/sql-safe-mcp --config /tmp/sql-safe-mcp-config.yaml --check-config

      - name: Verify release version metadata
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(uv run python -c 'from importlib.metadata import version; print(version("sql-safe-mcp"))')"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          jq --arg version "$VERSION" \
            '(.version, .packages[].version) = $version' \
            server.json > release-server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate MCP Registry metadata
        run: ./mcp-publisher validate release-server.json

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish release-server.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          Milestone 1 release: a minimal, read-only MCP server for SQL Server metadata.

          Six tools: list_servers, list_databases, list_tables, get_table_definition, list_stored_procedures, and get_stored_procedure. Arbitrary SQL execution is intentionally deferred to Milestone 2.

          Install and run directly from this tag:
          uvx --from git+https://github.com/proprock/sql-safe-mcp@${RELEASE_TAG} sql-safe-mcp

          See README.md for configuration and usage.
          EOF
          gh release create "${RELEASE_TAG}" dist/*.whl dist/*.tar.gz \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md

  # Deprecated sql-mini-mcp shim (compat/sql-mini-mcp) that depends on sql-safe-mcp. A pushed tag
  # never publishes it; run this workflow manually with package compat (or all).
  compat:
    needs: release
    if: >-
      ${{ !cancelled()
      && github.event_name == 'workflow_dispatch'
      && (inputs.package == 'compat' || inputs.package == 'all')
      && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build compat/sql-mini-mcp --out-dir dist-compat

      - name: Verify the wheel depends on sql-safe-mcp
        run: |
          python -m venv /tmp/verify-compat
          /tmp/verify-compat/bin/pip install --quiet --no-deps dist-compat/*.whl
          /tmp/verify-compat/bin/python - <<'PY'
          from importlib.metadata import requires, version

          dependencies = requires("sql-mini-mcp") or []
          assert any(item.replace(" ", "").startswith("sql-safe-mcp>=") for item in dependencies), dependencies
          print(version("sql-mini-mcp"), dependencies)
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-compat/
