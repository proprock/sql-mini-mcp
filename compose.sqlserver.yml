services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SAFE_MCP_DOCKER_SA_PASSWORD:?set by scripts/test-sqlserver.ps1}
    ports:
      - "127.0.0.1::1433"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 20s
    stop_grace_period: 20s
