name: sql-mini-mcp-mysql
services:
  mysql:
    image: mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    environment:
      MYSQL_ROOT_PASSWORD: ${SQL_MINI_MCP_DOCKER_ROOT_PASSWORD:?set by scripts/test-mysql.ps1}
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 15s
    stop_grace_period: 20s
  mariadb:
    image: mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
    environment:
      MARIADB_ROOT_PASSWORD: ${SQL_MINI_MCP_DOCKER_ROOT_PASSWORD:?set by scripts/test-mysql.ps1}
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 15s
    stop_grace_period: 20s
